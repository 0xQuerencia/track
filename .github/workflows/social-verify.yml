name: Verify isolated Track Social
on:
  pull_request:
    paths: ['social/**', '.github/workflows/social-verify.yml']
  push:
    branches: [main]
    paths: ['social/**', '.github/workflows/social-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix social test

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: social
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node browser-smoke/run.mjs
